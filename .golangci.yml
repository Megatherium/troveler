# golangci-lint configuration for troveler
# Keep this file valid against the golangci-lint v2 schema.
version: "2"
# Analyze production code and tests; this includes the configured slow linters.
run:
  tests: true
  timeout: 5m
  go: "1.25.6"
# Output configuration
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
  sort-order:
    - file
# Linters configuration
linters:
  enable:
    # Core linters
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - unconvert
    # Advanced checks
    - gosec
    - goconst
    - gocyclo
    - misspell
    - unparam
    # Code quality
    - revive
    - errname
    - errorlint
    - goheader
    - lll
    - makezero
    - nilerr
    - noctx
    - nlreturn
    - nolintlint
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - whitespace
  disable:
    - depguard
    - prealloc
  settings:
    govet:
      # Analyzer settings accept option maps; printf is enabled by enable-all.
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    errcheck:
      check-type-assertions: true
      check-blank: true
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-SA1019"]
    goconst:
      min-len: 2
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
      ignore-rules:
        - Ths
        - need
    lll:
      line-length: 120
      tab-width: 4
    nlreturn:
      block-size: 2
    nolintlint:
      require-specific: true
      require-explanation: true
    goheader:
      template: |-
        Copyright (c) {{ YEAR }} troveler contributors
        Use of this source code is governed by a MIT-style license that can be
        found in the LICENSE file in the root of the source tree or at
        https://opensource.org/licenses/MIT.
  default: standard
  exclusions:
    # Retain v1 generated-file behavior and disable default issue presets.
    generated: lax
    presets: []
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gocyclo
          - funlen
          - gocognit
          - lll
          - gochecknoglobals
          - gochecknoinits
          - nakedret
          - revive
          - rowserrcheck
          - sqlclosecheck
          - goheader
          - goconst
      - linters:
          - staticcheck
        text: "ST1005"
      - linters:
          - staticcheck
        text: "ST1006"
      - path: .*build_and_test\.sh$
        linters:
          - misspell
          - govet
          - staticcheck
    paths:
      # Match complete path components, not names such as build_plan.go.
      - (^|/)\.(git|beads|beans|perles)(/|$)
      - (^|/)(vendor|bin|dist|build|tmp)(/|$)
      - (^|/)integration/results(/|$)
      - (^|/)\.golangci\.yml$
      - (^|/)(third_party|builtin|examples)(/|$)
# Formatters configuration
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - (^|/)\.(git|beads|beans|perles)(/|$)
      - (^|/)(vendor|bin|dist|build|tmp)(/|$)
      - (^|/)integration/results(/|$)
      - (^|/)\.golangci\.yml$
      - (^|/)(third_party|builtin|examples)(/|$)
# Output limits apply per linter, not per file.
issues:
  max-issues-per-linter: 50
  max-same-issues: 0
  uniq-by-line: true
